 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Yoga Registration Form</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>


.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #fff;
  font-weight: 500;
  text-decoration: none;
  font-size: 15px;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(255, 0, 0, 0.2);
  transition: 0.3s;
}

.back-link:hover {
  background: rgba(255,255,255,0.35);
  color: #ff0000;
}



    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #92ffc0 0%, #002661 100%);
      font-family: 'Poppins', sans-serif;
    }

    /* ★ PREMIUM GLASS EFFECT BOX ★ */
    .form-container {
      max-width: 850px;
      margin: 40px auto;
      padding: 35px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: 0 8px 35px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.25);
      animation: fadeUp .8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity:0; transform: translateY(40px);}
      to { opacity:1; transform: translateY(0);}
    }

    /* Heading */
    .form-heading {
      text-align: center;
      font-size: 24px;
      color: #fff;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-subheading {
      text-align: center;
      font-size: 16px;
      color: #eee;
      margin-bottom: 25px;
    }

    /* Grid Layout */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      color: #fff;
      margin-bottom: 5px;
    }

    /* INPUT STYLE */
    .form-group input {
      height: 48px;
      border-radius: 10px;
      padding: 10px 14px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(255, 255, 255, 0.18);
      color: rgba(255,255,255,0.9);
      outline: none;
      font-size: 15px;
      transition: .3s;
    }

    /* Focus glow + text highlight */
    .form-group input:focus {
      border-color: #00ffae;
      box-shadow: 0 0 12px rgba(0,255,174,0.55);
      background: rgba(255,255,255,0.25);
      color: #fff;
    }

    /* Placeholder */
    ::placeholder { color: rgba(255,255,255,0.6); }

    /* SELECT BOXES WITH ARROW */
    .select-group {
      position: relative;
    }
    .select-group select {
      height: 73px;
      border-radius: 10px;
      padding: 10px 14px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(255, 255, 255, 0.18);
      color: rgba(255,255,255,0.9);
      outline: none;
      font-size: 15px;
      transition: .3s;
      appearance: none;
      padding-right: 40px; /* arrow space */
    }
    .select-group select:focus {
      border-color: #00ffae;
      box-shadow: 0 0 12px rgba(0,255,174,0.55);
      background: rgba(255,255,255,0.25);
      color: #fff;
    }
    .select-group::after {
      content: '▼';
      position: absolute;
      right: 12px;
      top: 70%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #fff;
      font-size: 14px;
    }
    .select-group select option {
      background: #162d6b;
      color: #fff;
    }

    /* Responsive */
    @media(max-width:700px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    /* SUBMIT BUTTON */
    .submit-btn {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      background: linear-gradient(120deg, #00ffae, #008cff);
      color: #fff;
      font-weight: 600;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: .3s;
    }
    .submit-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: rgba(255,255,255,0.45);
      transform: skewX(-25deg);
      transition: .4s;
    }
    .submit-btn:hover::after { left: 120%; }
    .submit-btn:hover { transform: scale(1.03); }

    /* ERROR MESSAGE */
    .error-msg {
      font-size: 13px;
      color: #ffdfdf;
      display: none;
      margin-top: 5px;
    }

    /* SUCCESS BOX */
    .success-box {
      background: rgba(0,255,174,0.25);
      padding: 15px;
      border-left: 4px solid #00ffae;
      color: #fff;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    /* Footer text */
    .footer-msg {
      margin-top: 15px;
      color: #fff;
      font-size: 14px;
      text-align: center;
      opacity: 0.9;
    }
  </style>
</head>
<body>
<a href="index.html" class="back-link">← Back to Home</a>

  <div class="form-container">

    <div class="form-heading">Please fill correct form</div>
    <div class="form-subheading">Premium Yoga Registration</div>

    <div class="success-box" id="successBox">
      🎉 Thank you! Your form has been submitted successfully.
    </div>

    <form id="yogaForm">

      <!-- ROW 1 -->
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" required placeholder="Enter age">
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="Enter valid email">
          <p class="error-msg" id="emailError">Invalid email address</p>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" maxlength="10" required placeholder="Enter phone number">
        </div>
      </div>

      <!-- ROW 3 -->
      <div class="form-row">
        <div class="form-group select-group">
          <label>Primary Goal</label>
          <select required>
            <option value="">Select</option>
            <option>Weight Loss</option>
            <option>PCOS & PCOD Management</option>
            <option>General Fitness</option>
            <option>Improve Flexibility</option>
            <option>Stress Relief</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group select-group">
          <label>Yoga Experience</label>
          <select required>
            <option value="">Select</option>
            <option>Complete Beginner</option>
            <option>Some Experience</option>
            <option>Intermediate</option>
            <option>Advanced</option>
          </select>
        </div>
      </div>

      <!-- ROW 4 -->
      <div class="form-row">
        <div class="form-group select-group">
          <label>Preferred Class Time</label>
          <select required>
            <option value="">Select</option>
            <option value=""><b> Morning</b></option>

            <option>5:30–6:30 AM</option>
            <option>7:00–8:00 AM</option>
            <option>8:00–9:00 AM</option>
            <option>12:00–1:00 PM</option>
            <option value=""> <b> Evening</b></option>

            <option>5:30–6:30 PM</option>
            <option>7:30–8:30 PM</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date of Joining</label>
          <input type="date" required>
        </div>
      </div>

      <button class="submit-btn">Submit Form</button>
    </form>

    <p class="footer-msg">
      🔒 Secure enrollment • 30-day money-back guarantee <br>
      By enrolling, you agree to our terms of service and privacy policy
    </p>

  </div>

  <!-- SCRIPT -->
  <script>
    const form = document.getElementById("yogaForm");
    const email = document.getElementById("email");
    const emailError = document.getElementById("emailError");
    const successBox = document.getElementById("successBox");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailPattern.test(email.value)) {
        emailError.style.display = "block";
        return;
      } else {
        emailError.style.display = "none";
      }

      successBox.style.display = "block";
      form.reset();

      setTimeout(() => {
        successBox.style.display = "none";
      }, 5000);
    });
  </script>

</body>
</html>
